name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check the tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Check the OpenChamber package
        run: bunx --package @openchamber/sdk@2.7.0 openchamber-guest-check

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's CHANGELOG.md section; a version without one gets GitHub's generated notes.
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Linear+ $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Linear+ $GITHUB_REF_NAME" --generate-notes
          fi
